name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install setup compiler
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: ./tools/Build-Setup.ps1
      - name: Build Store package and verify native integration
        shell: powershell
        run: ./tools/Build-Store.ps1 -SkipPublish
      - name: Verify application
        shell: powershell
        run: |
          $p = Start-Process ./dist/GrabPic/GrabPic.exe -ArgumentList '--verify',"$PWD/verification.txt" -PassThru
          $p.WaitForExit()
          Get-Content verification.txt
          if (Select-String -Path verification.txt -Pattern '^FAIL') { throw 'Verification failed.' }
      - name: Prepare submission files
        shell: powershell
        run: ./tools/Prepare-Submission.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Grabpic-Windows-and-Store
          path: |
            dist/Setup/*.exe
            dist/Grabpic-Submission-*.zip
            dist/Grabpic-Browser-*.zip
            submission/packages/*.msix
            submission/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist/Setup/*.exe, submission/packages/*.msix, dist/Grabpic-Submission-*.zip, dist/Grabpic-Browser-*.zip, submission/SHA256SUMS.txt | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title "Grabpic $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
